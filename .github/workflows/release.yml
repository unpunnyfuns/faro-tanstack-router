name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Test and release
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN only clones. Writes to the repo go through the
    # app token, and publishing authenticates to npm via id-token.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # registry-url is deliberately omitted. It makes setup-node write an
      # .npmrc containing a NODE_AUTH_TOKEN placeholder and point
      # NPM_CONFIG_USERCONFIG at it, which semantic-release then treats as
      # pre-existing auth and honours instead of NPM_TOKEN.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check published exports
        run: npm run check:exports

      # The default GITHUB_TOKEN cannot bypass a ruleset, so the release
      # commit from @semantic-release/git would be rejected on protected main.
      # github-actions[bot] is not an eligible bypass actor; a GitHub App is.
      - name: Generate a token for the release app
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # No NPM_TOKEN. Publishing authenticates via OIDC trusted publishing,
      # which needs the id-token: write permission granted above. This also
      # makes npm attach a signed provenance statement to each release.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release
