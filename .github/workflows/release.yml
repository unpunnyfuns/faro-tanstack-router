name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Test and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # registry-url is deliberately omitted. It makes setup-node write an
      # .npmrc containing a NODE_AUTH_TOKEN placeholder and point
      # NPM_CONFIG_USERCONFIG at it, which semantic-release then treats as
      # pre-existing auth and honours instead of NPM_TOKEN.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check published exports
        run: npm run check:exports

      # No NPM_TOKEN. Publishing authenticates via OIDC trusted publishing,
      # which needs the id-token: write permission granted above. This also
      # makes npm attach a signed provenance statement to each release.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
